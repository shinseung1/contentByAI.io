# 주제별 가이던스 설정
food:
  icon: "🍽️"
  guidance: |
    음식/요리 주제 특별 요구사항:
    - 재료 및 조리법 상세 설명
    - 맛집 정보 및 위치
    - 영양 정보 및 건강 효과
    - 보관 및 섭취 팁
    - 계절별/지역별 특징

health:
  icon: "🏥"
  guidance: |
    건강/의료 주제 특별 요구사항:
    - 증상 및 원인 설명
    - 예방 및 관리법
    - 전문 의료진 조언
    - 생활습관 개선 방법
    - ⚠️ 면책조항 포함: "본 정보는 참고용이며 전문의 상담을 권장합니다"

tourism:
  icon: "🗺️"
  guidance: |
    관광/여행지 주제 특별 요구사항:
    - 명소 상세 정보 (역사, 특징)
    - 실용 정보 (교통, 입장료, 운영시간)
    - 계절별 특징 및 최적 방문시기
    - 주변 관광 코스 및 추천 일정
    - 현지 맛집 및 쇼핑 정보

transportation:
  icon: "🚗"
  guidance: |
    교통/이동방법 주제 특별 요구사항:
    - 구체적인 교통수단 상세 설명
    - 소요시간 및 요금 정보
    - 단계별 이동 경로
    - 운행 시간표 및 배차간격
    - 예약 방법 및 주의사항

technology:
  icon: "💻"
  guidance: |
    기술/IT 주제 특별 요구사항:
    - 기술 개념 및 원리 설명
    - 실제 활용 방법 및 사례
    - 장단점 및 한계점
    - 초보자를 위한 단계별 가이드
    - 최신 트렌드 및 발전 전망

education:
  icon: "📚"
  guidance: |
    교육/학습 주제 특별 요구사항:
    - 학습 목표 및 커리큘럼
    - 단계별 학습 방법
    - 필요한 자료 및 도구
    - 실습 및 응용 방법
    - 평가 기준 및 성과 측정

business:
  icon: "💼"
  guidance: |
    비즈니스/경영 주제 특별 요구사항:
    - 비즈니스 모델 및 전략
    - 시장 분석 및 경쟁사 정보
    - 수익성 및 리스크 분석
    - 실무 적용 방법
    - 성공 사례 및 실패 사례

lifestyle:
  icon: "🏠"
  guidance: |
    라이프스타일 주제 특별 요구사항:
    - 일상 생활 개선 방법
    - 실용적인 팁과 노하우
    - 비용 및 효과 분석
    - 개인별 맞춤 방법
    - 장기적인 습관 형성 가이드

finance:
  icon: "💰"
  guidance: |
    금융/투자 주제 특별 요구사항:
    - 금융 상품 및 투자 방법
    - 리스크 및 수익성 분석
    - 절세 및 자산관리 전략
    - 초보자를 위한 기초 지식
    - ⚠️ 투자 위험 경고 포함

sports:
  icon: "⚽"
  guidance: |
    스포츠/운동 주제 특별 요구사항:
    - 운동 방법 및 기술
    - 체력 향상 및 건강 효과
    - 부상 예방 및 안전 수칙
    - 필요한 장비 및 준비사항
    - 단계별 훈련 프로그램

culture:
  icon: "🎭"
  guidance: |
    문화/예술 주제 특별 요구사항:
    - 역사적 배경 및 의미
    - 문화적 특징 및 가치
    - 감상 및 이해 방법
    - 체험 및 참여 방법
    - 현대적 의미 및 영향

# 기본 fallback 가이던스들
fallback:
  default:
    icon: "🎯"
    guidance: |
      Universal Guidance:
      - 주제의 핵심 가치 및 중요성 설명
      - 단계별 접근법 (입문 → 중급 → 전문가)
      - 실용적 팁과 주의사항
      - 다양한 관점에서의 분석
      - 실제 적용 사례 및 경험담
  
  comparison:
    icon: "⚖️"
    guidance: |
      비교 주제 특별 요구사항:
      - 명확한 비교 기준 설정
      - 각 항목별 장단점 분석
      - 상황별 추천 가이드
      - 비교 테이블 포함
      - 결론 및 선택 가이드 제시
  
  ranking:
    icon: "🏆"
    guidance: |
      랭킹/TOP 주제 특별 요구사항:
      - 순위 기준 명확히 제시
      - 각 순위별 상세 설명
      - 객관적 평가 요소 포함
      - 개인 취향별 추천
      - 순위 선정 근거 설명